version: '3.8'

services:
  # =========================================================================
  # 1. SICA-DB (POSTGRESQL): El motor principal de la base de datos de SICA
  # =========================================================================
  sica-db:
    # Usamos la versión 15-alpine por ser altamente estable y liviana. (La v18 daba problemas de volúmenes)
    image: postgres:15-alpine
    container_name: sica-postgres
    restart: always # Si la computadora se apaga, Docker lo vuelve a prender automáticamente
    environment:
      POSTGRES_DB: sica_db
      POSTGRES_USER: sica_user
      POSTGRES_PASSWORD: sica_pass
    ports:
      - "5432:5432" # Expone el puerto para que Java (Hibernate) pueda conectarse
    volumes:
      # Persistencia de datos: Si el contenedor se destruye, los datos sobreviven en este volumen
      - sica_pgdata:/var/lib/postgresql/data
      # Scripts de inicialización: Se ejecutan solos la primera vez que arranca para crear las tablas
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ../database/data.sql:/docker-entrypoint-initdb.d/02-data.sql

  # =========================================================================
  # 2. EVOLUTION API: Microservicio Node.js para conectar SICA con WhatsApp
  # =========================================================================
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: sica-evolution-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=sica_secret_key_123
      - LOG_LEVEL=ERROR
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://sica_user:sica_pass@sica-db:5432/sica_db?schema=evolution
      - REDIS_ENABLED=true
      - REDIS_URI=redis://sica-redis:6379
      - CACHE_REDIS_URI=redis://sica-redis:6379
      - REDIS_HOST=sica-redis
      - REDIS_PORT=6379
    depends_on:
      - sica-db
      - sica-redis

  sica-redis:
    image: redis:7-alpine
    container_name: sica-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  sica_pgdata:
